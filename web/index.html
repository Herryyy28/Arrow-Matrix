<!DOCTYPE html>
<html>
<head>
  <!--

    it to work correctly.

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Procedural 2D arrow-grid escape puzzle game with guaranteed solvability, heart lives, hints, undo, and daily challenges.">
  <meta property="og:title" content="Arrow Matrix">
  <meta property="og:description" content="Procedural 2D arrow-grid escape puzzle game with guaranteed solvability, heart lives, hints, undo, and daily challenges.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Arrow Matrix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Arrow Matrix</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Procedural Web Audio Synthesizer for Arrow Matrix
    (function() {
      let audioCtx = null;
      function getAudioContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            audioCtx = new AudioContext();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      window.playArrowSound = function(type) {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;

          if (type === 'swoosh') {
            // Arrow shifting & escaping flight sound
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(780, now + 0.18);
            osc.frequency.exponentialRampToValueAtTime(1100, now + 0.32);

            gain.gain.setValueAtTime(0.01, now);
            gain.gain.linearRampToValueAtTime(0.18, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.36);
          } else if (type === 'bump') {
            // Collision bump / blocked shift impact
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(60, now + 0.22);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
          } else if (type === 'undo') {
            // Reverse shift / return to cell
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(380, now + 0.25);

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.28);
          } else if (type === 'hint') {
            // Golden hint shimmer
            [587.33, 880.0, 1174.66].forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(freq, now + idx * 0.08);

              gain.gain.setValueAtTime(0.08, now + idx * 0.08);
              gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + idx * 0.08);
              osc.stop(now + idx * 0.08 + 0.32);
            });
          } else if (type === 'win') {
            // Victory chord
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freq, now + idx * 0.09);

              gain.gain.setValueAtTime(0.12, now + idx * 0.09);
              gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.6);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + idx * 0.09);
              osc.stop(now + idx * 0.09 + 0.65);
            });
          } else if (type === 'streak') {
            // Triumphant win-streak celebration fanfare
            [440.0, 554.37, 659.25, 880.0, 1108.73].forEach((freq, idx) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(freq, now + idx * 0.08);

              gain.gain.setValueAtTime(0.10, now + idx * 0.08);
              gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.5);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + idx * 0.08);
              osc.stop(now + idx * 0.08 + 0.55);
            });
          }
        } catch (e) {
          // Ignore audio errors if audio context blocked by browser autoplay policy
        }
      };
    })();
  </script>
</head>
<body>
  <!--

</body>
</html>
